<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>开盲盒 · Aholo Lux3D 黑客松</title>
  <script type="module" crossorigin src="./assets/index-DiYfDZuB.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/style-lO704fJ2.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🎁 开盲盒</h1>
      <div id="coins">0</div>
      <span id="mode-badge">…</span>
      <div id="import-bar">
        <button class="btn" id="btn-import" type="button" title="选择含有 ms-01.glb 等文件的文件夹">导入模型文件夹</button>
        <input id="import-input" type="file" accept=".glb,model/gltf-binary" multiple webkitdirectory directory style="display:none" />
        <button class="btn btn-danger" id="btn-reset" type="button">重置进度</button>
      </div>
      <div class="tabs">
        <button type="button" data-tab="shop" class="active">商店</button>
        <button type="button" data-tab="storage">仓库</button>
        <button type="button" data-tab="case">展柜</button>
      </div>
    </header>
    <div class="pity-bar" id="pity-info" style="padding:4px 16px;background:#12122a;border-bottom:1px solid #3a3a5c;"></div>
    <main>
      <div id="panel-shop" class="panel"></div>
      <div id="panel-storage" class="panel hidden"></div>
      <div id="panel-case" class="panel hidden"></div>
    </main>
  </div>
  <div id="toast"></div>
  <div id="win-overlay">
    <h2>🎉 全部集齐！</h2>
    <p id="win-stats">三个系列都收进展柜了。</p>
    <p style="color:#9aa0b0;font-size:14px">截图分享你的展柜吧。</p>
    <button class="btn btn-primary" id="btn-win-close" type="button">继续观赏</button>
  </div>
  <div id="series-complete-overlay">
    <h2 id="sc-title">系列集齐！</h2>
    <p id="sc-body"></p>
    <button class="btn btn-primary" id="btn-sc-close" type="button">太棒了</button>
  </div>
</body>
</html>
