<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>开盲盒 · Aholo Lux3D 黑客松</title>
  <style>#boot-msg{color:#eee;z-index:100;text-align:center;background:#0c0c16;flex-direction:column;justify-content:center;align-items:center;gap:12px;font-family:Microsoft YaHei,PingFang SC,system-ui,sans-serif;display:flex;position:fixed;inset:0}#boot-msg h2{color:#f5a623;margin:0;font-size:26px}#boot-msg p{color:#9aa0b0;margin:0}body.ready #boot-msg{display:none}</style>
  <script type="module" crossorigin src="./assets/index-Bia7lavP.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/style-f_sLQqVN.css">
</head>
<body>
  <div id="boot-msg">
    <h2 id="boot-title">请双击 启动游戏.bat 运行</h2>
    <p id="boot-sub">游戏需要通过启动器打开（macOS：右键 启动游戏.command → 打开）</p>
  </div>
  <div id="app">
    <header>
      <h1>🎁 开盲盒</h1>
      <div id="coins">0</div>
      <span id="player-badge"></span>
      <button class="btn btn-danger" id="btn-reset" type="button">重置进度</button>
      <div class="tabs">
        <button type="button" data-tab="shop" class="active">商店</button>
        <button type="button" data-tab="storage">仓库</button>
        <button type="button" data-tab="case">展柜</button>
        <button type="button" data-tab="records">记录</button>
      </div>
    </header>
    <div class="pity-bar" id="pity-info"></div>
    <main>
      <div id="panel-shop" class="panel"></div>
      <div id="panel-storage" class="panel hidden"></div>
      <div id="panel-case" class="panel hidden"></div>
      <div id="panel-records" class="panel hidden"></div>
    </main>
  </div>
  <div id="toast"></div>
  <div id="win-overlay">
    <h2>🎉 全部集齐！</h2>
    <p id="win-stats">所有手办都放进展柜了。</p>
    <p style="color:#9aa0b0;font-size:14px">截图分享你的展柜吧。</p>
    <button class="btn btn-primary" id="btn-win-close" type="button">继续观赏</button>
  </div>
</body>
</html>
